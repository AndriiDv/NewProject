name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ROLE_TO_ASSUME: arn:aws:iam::522400670358:role/GitHubActionsRole-NewProject
  PROJECT_NAME: new-project
  COGNITO_DOMAIN_PREFIX: andrii-dv
  AWS_STS_REGIONAL_ENDPOINTS: regional

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

  frontend-lint:
    name: Frontend Lint (oxlint + Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: oxlint
        run: npm run lint -- --format=github --deny-warnings

      - name: Prettier
        run: npx prettier --check .

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetings
          POSTGRES_PASSWORD: meetings
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/meetings_test
        run: uv run pytest -v

  deploy-auth:
    name: Deploy Cognito Auth
    needs: [backend-lint, frontend-lint, backend-test]
    runs-on: ubuntu-latest
    outputs:
      user_pool_id: ${{ steps.auth.outputs.user_pool_id }}
      client_id: ${{ steps.auth.outputs.client_id }}
      domain: ${{ steps.auth.outputs.domain }}
      issuer: ${{ steps.auth.outputs.issuer }}
      google_enabled: ${{ steps.auth.outputs.google_enabled }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy Auth Stack
        id: auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          ./infra/deploy-auth.sh || true
          POOL_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text 2>/dev/null || echo "")
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text 2>/dev/null || echo "")
          DOMAIN=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
            --query "Stacks[0].Outputs[?OutputKey=='Domain'].OutputValue" --output text 2>/dev/null || echo "")
          ISSUER=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
            --query "Stacks[0].Outputs[?OutputKey=='Issuer'].OutputValue" --output text 2>/dev/null || echo "")
          GOOGLE=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
            --query "Stacks[0].Outputs[?OutputKey=='GoogleEnabled'].OutputValue" --output text 2>/dev/null || echo "false")
          echo "user_pool_id=$POOL_ID" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "issuer=$ISSUER" >> $GITHUB_OUTPUT
          echo "google_enabled=$GOOGLE" >> $GITHUB_OUTPUT

  deploy-backend:
    name: Build & Deploy Backend (Serverless Lambda + API Gateway)
    needs: [deploy-auth]
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.backend.outputs.api_url }}
      api_base_url: ${{ steps.backend.outputs.api_base_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Public Amazon ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws || true

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG backend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy Backend Stack
        id: backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-backend
          IMAGE_TAG: ${{ github.sha }}
          POOL_ID: ${{ needs.deploy-auth.outputs.user_pool_id }}
          CLIENT_ID: ${{ needs.deploy-auth.outputs.client_id }}
          ISSUER: ${{ needs.deploy-auth.outputs.issuer }}
        run: |
          PASSWORD_PARAM="/${{ env.PROJECT_NAME }}/db-password"
          if aws ssm get-parameter --name "$PASSWORD_PARAM" >/dev/null 2>&1; then
            DB_PASSWORD=$(aws ssm get-parameter --name "$PASSWORD_PARAM" --with-decryption --query Parameter.Value --output text)
          else
            DB_PASSWORD=$(openssl rand -hex 24)
            aws ssm put-parameter --name "$PASSWORD_PARAM" --type SecureString --value "$DB_PASSWORD" >/dev/null
          fi
          if [ -z "$POOL_ID" ]; then
            POOL_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text 2>/dev/null || echo "")
          fi
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text 2>/dev/null || echo "")
          fi
          DB_ENDPOINT=$(aws rds describe-db-clusters --db-cluster-identifier ${{ env.PROJECT_NAME }}-db \
            --query "DBClusters[0].Endpoint" --output text 2>/dev/null || echo "")
          aws cloudformation deploy \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --template-file infra/backend.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${{ env.PROJECT_NAME }}" \
              "ImageUri=$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
              "DatabaseEndpoint=${DB_ENDPOINT:-new-project-db.cluster-cxuqe02cwqxo.eu-north-1.rds.amazonaws.com}" \
              "DBPassword=$DB_PASSWORD" \
              "CognitoUserPoolId=$POOL_ID" \
              "CognitoClientId=$CLIENT_ID" \
              "CorsOrigins=*" \
            --no-fail-on-empty-changeset

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          API_BASE=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "api_base_url=$API_BASE" >> $GITHUB_OUTPUT

      - name: Wait for Backend Health Check
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          if [ -n "$API_URL" ] && [ "$API_URL" != "None" ]; then
            echo "Waiting for health check at $API_URL/health..."
            for i in $(seq 1 30); do
              if curl -fsS --max-time 10 "$API_URL/health" > /dev/null 2>&1; then
                echo "Backend is healthy at $API_URL!"
                exit 0
              fi
              echo "Waiting for backend to become healthy (attempt $i/30)..."
              sleep 10
            done
            echo "Backend failed to become healthy in time."
            exit 1
          fi

  deploy-frontend:
    name: Build & Deploy Frontend (S3 + CloudFront)
    needs: [deploy-auth, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch Infrastructure Info
        id: info
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text 2>/dev/null || echo "")
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Build Frontend Bundle
        working-directory: frontend
        run: |
          API_BASE="${{ needs.deploy-backend.outputs.api_base_url }}"
          if [ -z "$API_BASE" ]; then
            API_BASE=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.PROJECT_NAME }}-backend \
              --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
              --output text 2>/dev/null || echo "")
          fi
          POOL_ID="${{ needs.deploy-auth.outputs.user_pool_id }}"
          if [ -z "$POOL_ID" ]; then
            POOL_ID=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
              --output text 2>/dev/null || echo "")
          fi
          CLIENT_ID="${{ needs.deploy-auth.outputs.client_id }}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
              --output text 2>/dev/null || echo "")
          fi
          DOMAIN="${{ needs.deploy-auth.outputs.domain }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='Domain'].OutputValue" \
              --output text 2>/dev/null || echo "")
          fi
          GOOGLE="${{ needs.deploy-auth.outputs.google_enabled }}"
          if [ -z "$GOOGLE" ]; then
            GOOGLE=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.PROJECT_NAME }}-auth \
              --query "Stacks[0].Outputs[?OutputKey=='GoogleEnabled'].OutputValue" \
              --output text 2>/dev/null || echo "false")
          fi
          npm ci
          VITE_API_URL="$API_BASE" \
          COGNITO_USER_POOL_ID="$POOL_ID" \
          COGNITO_CLIENT_ID="$CLIENT_ID" \
          COGNITO_DOMAIN="$DOMAIN" \
          COGNITO_GOOGLE_ENABLED="$GOOGLE" \
          npm run build

      - name: Deploy Frontend Stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --template-file infra/frontend.yaml \
            --parameter-overrides "ProjectName=${{ env.PROJECT_NAME }}" \
            --no-fail-on-empty-changeset

      - name: Sync Frontend Assets to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/dist/assets "s3://${BUCKET}/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync frontend/dist "s3://${BUCKET}" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront Cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
