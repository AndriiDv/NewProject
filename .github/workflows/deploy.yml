name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ROLE_TO_ASSUME: arn:aws:iam::522400670358:role/GitHubActionsRole-NewProject
  PROJECT_NAME: new-project
  AWS_STS_REGIONAL_ENDPOINTS: regional

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

  frontend-lint:
    name: Frontend Lint (oxlint + Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: oxlint
        run: npm run lint -- --format=github --deny-warnings

      - name: Prettier
        run: npx prettier --check .

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetings
          POSTGRES_PASSWORD: meetings
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/meetings_test
        run: uv run pytest -v

  deploy-backend:
    name: Build & Deploy Backend (ECS Fargate)
    needs: [backend-lint, frontend-lint, backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest backend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy Backend Stack
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --template-file infra/backend.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName=${{ env.PROJECT_NAME }} \
              ImageUri=$REGISTRY/$REPOSITORY:$IMAGE_TAG \
              CorsOrigins="*" \
            --no-fail-on-empty-changeset

      - name: Update ECS Service & Set Desired Count
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --service ${{ env.PROJECT_NAME }}-service \
            --desired-count 1 \
            --force-new-deployment

      - name: Wait for Backend Health Check
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)
          API_URL="http://$ALB_DNS/api"
          echo "Waiting for health check at $API_URL/health..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API_URL/health" > /dev/null 2>&1; then
              echo "Backend is healthy at $API_URL!"
              exit 0
            fi
            echo "Waiting for backend to become healthy (attempt $i/30)..."
            sleep 10
          done
          echo "Backend failed to become healthy in time."
          exit 1

  deploy-frontend:
    name: Build & Deploy Frontend (S3 + CloudFront)
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch Infrastructure Info
        id: info
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-backend \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Build Frontend Bundle
        working-directory: frontend
        env:
          VITE_API_URL: http://${{ steps.info.outputs.alb_dns }}
        run: |
          npm ci
          npm run build

      - name: Sync Frontend Assets to S3
        run: |
          aws s3 sync frontend/dist/assets "s3://${{ steps.info.outputs.bucket }}/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync frontend/dist "s3://${{ steps.info.outputs.bucket }}" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.info.outputs.dist_id }}" \
            --paths "/*"
