AWSTemplateFormatVersion: "2010-09-09"
Description: "Paste an Agenda - AWS Bedrock LLM Parser Lambda outside VPC with Function URL"

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Prefix for all resource names

  ImageUri:
    Type: String
    Description: Docker image URI in ECR containing the backend application

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID for validating ID tokens

  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito App Client ID for validating ID tokens

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS Region where Bedrock Claude models are hosted

  ParserModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock Claude Inference Profile or Model ID

Resources:
  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: "Parses raw unstructured meeting text into structured JSON agenda schema via AWS Bedrock"
      Role: !GetAtt AgendaParserRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          BEDROCK_REGION: !Ref BedrockRegion
          PARSER_MODEL: !Ref ParserModel
          DISABLE_LWA: "true"
          AGENDA_PARSER: "true"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
          - x-requested-with
        MaxAge: 3600

  AgendaParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AgendaParserFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Description: Public AWS Lambda Function URL for agenda parser
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl

  FunctionName:
    Description: Lambda Function Name
    Value: !Ref AgendaParserFunction

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt AgendaParserFunction.Arn
