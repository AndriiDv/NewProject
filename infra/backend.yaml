AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - backend API on AWS Lambda (container image) behind HTTP API Gateway
  with Cognito JWT Authorizer, connected to an Aurora Serverless v2 PostgreSQL database.
  The Lambda function runs in private subnets with access to the database.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Full backend image URI including tag (pushed by deploy-backend).
  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for Aurora PostgreSQL database.
  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated origins allowed to call the API.
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the API accepts.
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to.
  CognitoJwks:
    Type: String
    Default: ""
    Description: Preloaded JWKS keys for offline token verification inside VPC.
  MemorySize:
    Type: Number
    Default: 512
    Description: Lambda memory in MB.
  DBMinCapacity:
    Type: Number
    Default: 0
    Description: Minimum Aurora capacity units (0 allows auto-pause).
  DBMaxCapacity:
    Type: Number
    Default: 1
    Description: Maximum Aurora capacity units.
  DBAutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle time before the database pauses (only with DBMinCapacity 0).
  DBName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref ProjectName
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --------------------------------------------------------- Security groups
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Lambda function (outbound only)
      VpcId: !Ref Vpc
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the backend function
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the backend database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBCluster
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [E3690, W1011]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub ${ProjectName}-db
      Engine: aurora-postgresql
      EngineVersion: "17.11"
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DBMinCapacity
        MaxCapacity: !Ref DBMaxCapacity
        SecondsUntilAutoPause: !Ref DBAutoPauseSeconds
      StorageEncrypted: true
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db-1
      DBClusterIdentifier: !Ref Database
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ------------------------------------------------------------------ Backend
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/backend
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    DependsOn: DatabaseInstance
    Properties:
      FunctionName: !Sub ${ProjectName}-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+asyncpg://${DBUser}:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "1"
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /api/health
          AWS_LWA_ASYNC_INIT: "true"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ----------------------------------------------------------- API Gateway
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref CorsOrigins]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "HEAD"]
        AllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Amz-Date"
          - "X-Api-Key"
          - "X-Amz-Security-Token"
          - "X-Amz-User-Agent"
          - "X-Requested-With"
        MaxAge: 300
      Tags:
        PROJECT_NAME: !Ref ProjectName

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      Name: CognitoAuthorizer
      JwtConfiguration:
        Audience:
          - !Ref CognitoClientId
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  # Public route: health check
  HealthCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/health"
      Target: !Sub integrations/${HttpApiIntegration}

  # Public route: docs
  DocsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/docs"
      Target: !Sub integrations/${HttpApiIntegration}

  OpenApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/openapi.json"
      Target: !Sub integrations/${HttpApiIntegration}

  # Protected default route for all other endpoints (secured by Cognito JWT Authorizer)
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      Tags:
        PROJECT_NAME: !Ref ProjectName

  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiBaseUrl:
    Description: Base URL of the API Gateway (without path)
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub ${HttpApi.ApiEndpoint}/api
  DocsUrl:
    Description: OpenAPI docs URL
    Value: !Sub ${HttpApi.ApiEndpoint}/api/docs
  FunctionName:
    Value: !Ref Function
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  HttpApiId:
    Value: !Ref HttpApi
  LogGroup:
    Value: !Ref LogGroup
